name: Atualizacao Automatica Dashboard Portuario

on:
  schedule:
    - cron: '0 11 1 * *'
  workflow_dispatch:

jobs:
  atualizar-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install pandas numpy matplotlib scipy requests

      - name: Baixar dados ANTAQ e gerar dashboard
        run: python gerar_dashboard.py

      - name: Publicar dashboard atualizado
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dashboard_portuario_vila_conde.html
          git diff --staged --quiet || git commit -m "Atualizacao automatica"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

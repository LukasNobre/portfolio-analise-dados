name: 🚢 Atualização Automática — Dashboard Portuário

on:
  # Roda todo dia 1º do mês às 08h (horário de Brasília = 11h UTC)
  schedule:
    - cron: '0 11 1 * *'

  # Permite rodar manualmente pelo GitHub (botão "Run workflow")
  workflow_dispatch:

jobs:
  atualizar-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      # 1. Baixa o repositório
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      # 2. Instala Python
      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Instala dependências
      - name: 📦 Instalar dependências
        run: |
          pip install pandas numpy matplotlib scipy requests

      # 4. Baixa dados novos da ANTAQ automaticamente
      - name: 📡 Baixar dados ANTAQ (Atracação + Carga)
        run: |
          python - <<'EOF'
          import requests, os, zipfile, io
          from datetime import datetime

          ano_atual = datetime.now().year
          anos = list(range(2015, ano_atual + 1))

          os.makedirs("Dados Atracacao", exist_ok=True)
          os.makedirs("Dados Carga", exist_ok=True)

          BASE = "https://web3.antaq.gov.br/ea/txt"

          for ano in anos:
              # Atracação
              arq_a = f"Dados Atracacao/{ano}Atracacao.txt"
              if not os.path.exists(arq_a):
                  try:
                      url = f"{BASE}/{ano}Atracacao.zip"
                      r = requests.get(url, timeout=120)
                      if r.status_code == 200:
                          z = zipfile.ZipFile(io.BytesIO(r.content))
                          z.extractall("Dados Atracacao")
                          print(f"✅ Atracacao {ano} baixado")
                      else:
                          print(f"⚠️  Atracacao {ano} não disponível (HTTP {r.status_code})")
                  except Exception as e:
                      print(f"⚠️  Erro Atracacao {ano}: {e}")
              else:
                  print(f"⏭️  Atracacao {ano} já existe, pulando")

              # Carga
              arq_c = f"Dados Carga/{ano}Carga.txt"
              if not os.path.exists(arq_c):
                  try:
                      url = f"{BASE}/{ano}Carga.zip"
                      r = requests.get(url, timeout=300)
                      if r.status_code == 200:
                          z = zipfile.ZipFile(io.BytesIO(r.content))
                          z.extractall("Dados Carga")
                          print(f"✅ Carga {ano} baixado")
                      else:
                          print(f"⚠️  Carga {ano} não disponível (HTTP {r.status_code})")
                  except Exception as e:
                      print(f"⚠️  Erro Carga {ano}: {e}")
              else:
                  print(f"⏭️  Carga {ano} já existe, pulando")

          print("\n📊 Download concluído!")
          EOF

      # 5. Roda o script de análise e gera o dashboard atualizado
      - name: 🔬 Rodar análise DEA e gerar dashboard
        run: |
          python - <<'EOF'
          import os, sys
          import pandas as pd
          import numpy as np
          from scipy import stats
          from scipy.optimize import linprog
          from datetime import datetime

          print("=" * 60)
          print("  PIPELINE AUTOMÁTICO — ANÁLISE PORTUÁRIA ANTAQ")
          print(f"  Execução: {datetime.now().strftime('%d/%m/%Y %H:%M')}")
          print("=" * 60)

          # ── Carregar dados ──────────────────────────────────────
          CAMP_ATRAC = "Dados Atracacao"
          CAMP_CARGA = "Dados Carga"

          dfs_a, dfs_c = [], []

          for arq in sorted(os.listdir(CAMP_ATRAC)):
              if arq.endswith('.txt'):
                  try:
                      df = pd.read_csv(f"{CAMP_ATRAC}/{arq}", delimiter=';',
                                       encoding='utf-8-sig', dtype=str)
                      dfs_a.append(df)
                      print(f"  ✔ {arq} — {len(df):,} linhas")
                  except Exception as e:
                      print(f"  ⚠️  Erro em {arq}: {e}")

          for arq in sorted(os.listdir(CAMP_CARGA)):
              if arq.endswith('.txt'):
                  try:
                      df = pd.read_csv(f"{CAMP_CARGA}/{arq}", delimiter=';',
                                       encoding='utf-8-sig', dtype=str)
                      dfs_c.append(df)
                      print(f"  ✔ {arq} — {len(df):,} linhas")
                  except Exception as e:
                      print(f"  ⚠️  Erro em {arq}: {e}")

          if not dfs_a or not dfs_c:
              print("❌ Dados insuficientes. Abortando.")
              sys.exit(1)

          df_atrac = pd.concat(dfs_a, ignore_index=True)
          df_carga = pd.concat(dfs_c, ignore_index=True)
          print(f"\n  Total Atracação: {len(df_atrac):,} | Carga: {len(df_carga):,}")

          # ── Filtro de soja ──────────────────────────────────────
          df_carga['VLPesoCargaBruta'] = (
              df_carga['VLPesoCargaBruta'].str.replace(',', '.').astype(float, errors='ignore')
          )
          df_cf = df_carga.loc[
              (df_carga['STSH4'] == 'Exclusivo') &
              (df_carga['Sentido'] == 'Embarcados') &
              (df_carga['Natureza da Carga'] == 'Granel Sólido') &
              (df_carga['CDMercadoria'] == '1201')
          ].reset_index(drop=True)

          # ── Agrupamento e merge ─────────────────────────────────
          cols_grp = ['IDAtracacao','CDMercadoria','Tipo Operação da Carga',
                      'Tipo Navegação','Percurso Transporte Interiores',
                      'STNaturezaCarga','STSH2','STSH4','Natureza da Carga',
                      'Sentido','TEU','QTCarga']
          df_ag = df_cf.groupby(cols_grp)['VLPesoCargaBruta'].sum().reset_index()
          df_m  = pd.merge(df_ag, df_atrac, on='IDAtracacao', how='inner')
          df_p  = df_m[df_m['Complexo Portuário']=='Vila do Conde - Belém'].reset_index(drop=True)

          # ── Calcular indicadores ────────────────────────────────
          fmt = '%d/%m/%Y %H:%M:%S'
          for col in ['Data Atracação','Data Desatracação',
                      'Data Início Operação','Data Término Operação']:
              df_p[col] = pd.to_datetime(df_p[col], format=fmt, errors='coerce')

          df_p['Horas_Op'] = (
              (df_p['Data Término Operação'] - df_p['Data Início Operação'])
              .dt.total_seconds() / 3600
          )
          df_p['Prancha'] = (
              df_p['VLPesoCargaBruta'] /
              df_p['Horas_Op'].replace(0, np.nan)
          )
          df_p = df_p[(df_p['Horas_Op'] > 0) & (df_p['Prancha'] > 0)].copy()

          # ── Agregar por Ano e Berço ─────────────────────────────
          resumo = df_p.groupby(['Ano','Berço']).agg(
              prancha    = ('Prancha','mean'),
              volume_Mt  = ('VLPesoCargaBruta', lambda x: x.sum()/1e6),
              atracacoes = ('IDAtracacao','count'),
              horas_op   = ('Horas_Op','mean'),
          ).reset_index()

          resumo['prancha']   = resumo['prancha'].round(1)
          resumo['volume_Mt'] = resumo['volume_Mt'].round(2)
          resumo['horas_op']  = resumo['horas_op'].round(1)

          # ── DEA-CCR por ano ────────────────────────────────────
          escores = []
          for ano in resumo['Ano'].unique():
              sub = resumo[resumo['Ano']==ano].reset_index(drop=True)
              if len(sub) < 2:
                  for _, r in sub.iterrows():
                      escores.append({'Ano':ano,'Berço':r['Berço'],'dea':100.0})
                  continue
              X = sub[['horas_op']].values.astype(float)
              Y = sub[['prancha','volume_Mt']].values.astype(float)
              Xn = (X-X.min(0))/(X.max(0)-X.min(0)+1e-9)
              Yn = (Y-Y.min(0))/(Y.max(0)-Y.min(0)+1e-9)
              Xn = np.clip(Xn,1e-6,None); Yn = np.clip(Yn,1e-6,None)
              n = len(sub)
              for i in range(n):
                  c = np.zeros(1+n); c[0]=1.0
                  Au = np.zeros((1+2,1+n)); bu = np.zeros(1+2)
                  Au[0,0]=-Xn[i,0]; Au[0,1:]=Xn[:,0]
                  Au[1,1:]=-Yn[:,0]; bu[1]=-Yn[i,0]
                  Au[2,1:]=-Yn[:,1]; bu[2]=-Yn[i,1]
                  bounds=[(0,1.0)]+[(0,None)]*n
                  res=linprog(c,A_ub=Au,b_ub=bu,bounds=bounds,method='highs')
                  sc = round(min(res.x[0],1.0)*100,1) if res.success else 100.0
                  escores.append({'Ano':ano,'Berço':sub.loc[i,'Berço'],'dea':sc})

          df_dea = pd.DataFrame(escores)
          resumo = resumo.merge(df_dea, on=['Ano','Berço'], how='left')

          # Tendência volume total
          tot = df_p.groupby('Ano')['VLPesoCargaBruta'].sum()/1e6
          tot = tot.reset_index()
          tot.columns = ['Ano','total_Mt']
          tot['Ano_num'] = tot['Ano'].astype(int)
          slope,intercept,r,p,_ = stats.linregress(tot['Ano_num'],tot['total_Mt'])

          ultima_atualizacao = datetime.now().strftime('%d/%m/%Y %H:%M')
          anos_lista   = sorted(resumo['Ano'].unique().tolist())
          bercos_lista = sorted(resumo['Berço'].unique().tolist())

          print(f"\n  Anos analisados: {anos_lista}")
          print(f"  Berços: {bercos_lista}")
          print(f"  Tendência: {slope:+.3f} Mt/ano | R²={r**2:.3f}")

          # ── Montar JSON de dados para o HTML ───────────────────
          dados_json = {}
          for berco in bercos_lista:
              sub = resumo[resumo['Berço']==berco].sort_values('Ano')
              dados_json[berco] = {
                  'prancha':    sub['prancha'].tolist(),
                  'volume':     sub['volume_Mt'].tolist(),
                  'atracacoes': sub['atracacoes'].tolist(),
                  'horas':      sub['horas_op'].tolist(),
                  'dea':        sub['dea'].tolist(),
              }

          total_vol = tot['total_Mt'].tolist()
          tend_vol  = [round(slope*(int(a)-int(anos_lista[0]))+total_vol[0],2)
                       for a in anos_lista]

          vol_acum  = round(tot['total_Mt'].sum(),1)
          prancha_max = resumo['prancha'].max()
          berco_max   = resumo.loc[resumo['prancha'].idxmax(),'Berço']
          ano_max     = resumo.loc[resumo['prancha'].idxmax(),'Ano']

          import json
          dados_js = json.dumps({
              'anos':        anos_lista,
              'bercos':      bercos_lista,
              'dados':       dados_json,
              'total_vol':   total_vol,
              'tend_vol':    tend_vol,
              'vol_acum':    vol_acum,
              'prancha_max': prancha_max,
              'berco_max':   berco_max,
              'ano_max':     ano_max,
              'slope':       round(slope,3),
              'r2':          round(r**2,3),
              'atualizado':  ultima_atualizacao,
          }, ensure_ascii=False)

          # ── Gerar HTML atualizado ───────────────────────────────
          html = f"""<!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1.0">
          <title>Dashboard Portuário — Vila do Conde · Belém</title>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
          <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
          <style>
            :root {{
              --bg:#060d1a; --surface:#0c1829; --surface2:#112238; --border:#1e3450;
              --teal:#00c9a7; --teal-dim:#007d68; --amber:#f5a623; --red:#ff4e6a;
              --blue:#3d9be9; --text:#e8edf4; --muted:#6b8aaa; --mono:'DM Mono',monospace;
            }}
            *,*::before,*::after{{box-sizing:border-box;margin:0;padding:0}}
            body{{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.6}}
            header{{padding:48px 40px 40px;background:linear-gradient(135deg,#060d1a,#091525,#0a1e36);border-bottom:1px solid var(--border);position:relative;overflow:hidden}}
            header::before{{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 600px 300px at 80% 50%,rgba(0,201,167,.08),transparent 70%)}}
            .hg{{position:relative;display:grid;grid-template-columns:1fr auto;align-items:end;gap:20px;max-width:1400px;margin:0 auto}}
            .hlbl{{font-family:var(--mono);font-size:11px;letter-spacing:.15em;color:var(--teal);text-transform:uppercase;margin-bottom:12px}}
            h1{{font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,5vw,64px);letter-spacing:.04em;line-height:1}}
            h1 span{{color:var(--teal)}}
            .hsub{{margin-top:10px;font-size:13px;color:var(--muted);max-width:560px;line-height:1.7}}
            .upd{{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:4px 12px;border-radius:20px;font-family:var(--mono);font-size:11px;color:var(--teal);border:1px solid var(--teal-dim);background:rgba(0,201,167,.06)}}
            .hkpis{{display:grid;grid-template-rows:repeat(3,1fr);gap:10px;text-align:right}}
            .km .val{{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--teal)}}
            .km .lbl{{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}}
            nav{{background:var(--surface);border-bottom:1px solid var(--border);padding:0 40px;position:sticky;top:0;z-index:100}}
            nav ul{{list-style:none;display:flex;max-width:1400px;margin:0 auto}}
            nav a{{display:block;padding:14px 18px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;border-bottom:2px solid transparent;transition:all .2s}}
            nav a:hover{{color:var(--text)}} nav a.active{{color:var(--teal);border-bottom-color:var(--teal)}}
            main{{max-width:1400px;margin:0 auto;padding:40px}}
            section{{margin-bottom:60px;scroll-margin-top:60px}}
            .stag{{font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:var(--teal);text-transform:uppercase;margin-bottom:6px}}
            .stitle{{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.05em}}
            .sdesc{{margin-top:6px;font-size:13px;color:var(--muted);max-width:700px;line-height:1.7}}
            .krow{{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}}
            .kcard{{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px 20px;position:relative;overflow:hidden}}
            .kcard::after{{content:'';position:absolute;bottom:0;left:0;right:0;height:2px}}
            .kcard.t::after{{background:var(--teal)}} .kcard.a::after{{background:var(--amber)}}
            .kcard.b::after{{background:var(--blue)}} .kcard.r::after{{background:var(--red)}}
            .klbl{{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}}
            .kval{{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:.04em;margin:4px 0 2px}}
            .kcard.t .kval{{color:var(--teal)}} .kcard.a .kval{{color:var(--amber)}}
            .kcard.b .kval{{color:var(--blue)}} .kcard.r .kval{{color:var(--red)}}
            .kdelta{{font-size:11px;color:var(--muted)}} .kdelta.up{{color:var(--teal)}}
            .crow{{display:grid;gap:24px}}
            .crow2{{grid-template-columns:1fr 1fr}} .crow-m{{grid-template-columns:2fr 1fr}}
            .card{{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .25s}}
            .card:hover{{border-color:var(--teal-dim)}}
            .ch{{padding:20px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:20px}}
            .ctitle{{font-weight:600;font-size:14px;color:var(--text);line-height:1.3}}
            .csub{{margin-top:3px;font-size:11px;color:var(--muted)}}
            .cins{{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:11px;color:var(--muted);line-height:1.6;min-width:200px;max-width:260px}}
            .cins strong{{color:var(--teal);display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}}
            .cw{{padding:16px 20px 20px}}
            footer{{background:var(--surface);border-top:1px solid var(--border);padding:28px 40px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}}
            footer span{{color:var(--teal)}}
            @media(max-width:900px){{.crow2,.crow-m{{grid-template-columns:1fr}}.krow{{grid-template-columns:1fr 1fr}}.hg{{grid-template-columns:1fr}}}}
          </style>
          </head>
          <body>

          <header>
            <div class="hg">
              <div>
                <p class="hlbl">⚓ Análise Portuária · ANTAQ · Soja (CDMercadoria 1201) · Atualização automática mensal</p>
                <h1>VILA DO CONDE<br><span>BELÉM</span></h1>
                <p class="hsub">Análise de movimentação portuária de soja no Complexo Vila do Conde – Belém (PA), com metodologia DEA-CCR para identificação de eficiência operacional por berço.</p>
                <div class="upd">🔄 Última atualização: {ultima_atualizacao} · Dados: ANTAQ</div>
              </div>
              <div class="hkpis" id="hkpis"></div>
            </div>
          </header>

          <nav>
            <ul>
              <li><a href="#kpis" class="active">KPIs</a></li>
              <li><a href="#volume">Volume</a></li>
              <li><a href="#prancha">Prancha</a></li>
              <li><a href="#dea">DEA</a></li>
            </ul>
          </nav>

          <main>
            <section id="kpis">
              <div class="stag">01 · Indicadores Gerais</div>
              <h2 class="stitle">RESUMO EXECUTIVO</h2>
              <p class="sdesc">Métricas acumuladas do período analisado. Dados atualizados automaticamente mensalmente via GitHub Actions.</p>
              <div class="krow" id="kpis-cards"></div>
              <div class="crow crow-m">
                <div class="card">
                  <div class="ch">
                    <div><div class="ctitle">Volume Total Embarcado por Ano (Mt)</div><div class="csub">Somatório dos berços + linha de tendência</div></div>
                    <div class="cins"><strong>📈 Tendência</strong><span id="ins-tend"></span></div>
                  </div>
                  <div class="cw"><canvas id="cVolTotal" height="90"></canvas></div>
                </div>
                <div class="card">
                  <div class="ch"><div><div class="ctitle">Participação por Berço</div><div class="csub">% do volume total acumulado</div></div></div>
                  <div class="cw"><canvas id="cPizza" height="160"></canvas></div>
                </div>
              </div>
            </section>

            <section id="volume">
              <div class="stag">02 · Movimentação por Berço</div>
              <h2 class="stitle">VOLUME EMBARCADO POR BERÇO</h2>
              <p class="sdesc">Evolução anual do volume de soja (Mt) por berço. Dados extraídos e processados automaticamente do sistema ANTAQ.</p>
              <div class="crow crow2" id="vol-bercos"></div>
            </section>

            <section id="prancha">
              <div class="stag">03 · Produtividade</div>
              <h2 class="stitle">PRANCHA OPERACIONAL (t/h)</h2>
              <p class="sdesc">Toneladas embarcadas por hora efetiva de operação. Meta ANTAQ para granel sólido em terminal privatizado: ≥ 800 t/h.</p>
              <div class="card">
                <div class="ch"><div><div class="ctitle">Evolução da Prancha por Berço (t/h)</div><div class="csub">Linha tracejada = meta ANTAQ 800 t/h</div></div></div>
                <div class="cw"><canvas id="cPrancha" height="100"></canvas></div>
              </div>
            </section>

            <section id="dea">
              <div class="stag">04 · DEA-CCR</div>
              <h2 class="stitle">EFICIÊNCIA OPERACIONAL</h2>
              <p class="sdesc">Modelo DEA-CCR (Charnes, Cooper & Rhodes, 1978). Score 100% = fronteira eficiente. Calculado automaticamente para cada ano.</p>
              <div class="card">
                <div class="ch"><div><div class="ctitle">Escores DEA-CCR por Berço</div><div class="csub">100% = benchmarking</div></div></div>
                <div class="cw"><canvas id="cDEA" height="100"></canvas></div>
              </div>
            </section>
          </main>

          <footer>
            <p>Fonte: <span>ANTAQ</span> — Sistema de Informações Aquaviárias · Complexo Vila do Conde – Belém · Soja (CDMercadoria 1201)</p>
            <p style="margin-top:6px">Metodologia: <span>DEA-CCR</span> · Python 3 · GitHub Actions · Atualização automática mensal · Lucas Nobre</p>
          </footer>

          <script>
          const D = {dados_js};
          const anos = D.anos;
          const bercos = D.bercos;

          Chart.defaults.color='#6b8aaa';
          Chart.defaults.font.family="'DM Sans',sans-serif";
          Chart.defaults.font.size=11;
          const grid={{color:'rgba(30,52,80,0.6)',drawBorder:false}};
          const tck={{color:'#6b8aaa',font:{{size:10}}}};
          const tip={{backgroundColor:'#112238',borderColor:'#1e3450',borderWidth:1,titleColor:'#e8edf4',bodyColor:'#6b8aaa'}};
          function bOpts(s=''){{return{{responsive:true,maintainAspectRatio:true,plugins:{{legend:{{labels:{{color:'#6b8aaa',boxWidth:12,font:{{size:11}}}}}},tooltip:tip}},scales:{{x:{{grid,ticks:tck}},y:{{grid,ticks:{{...tck,callback:v=>v+s}},beginAtZero:false}}}}}};}}

          // KPIs header
          document.getElementById('hkpis').innerHTML = `
            <div class="km"><div class="val">${{D.vol_acum}}</div><div class="lbl">Mt acumuladas</div></div>
            <div class="km"><div class="val">${{D.prancha_max.toFixed(0)}}</div><div class="lbl">t/h máx (${{D.berco_max}} ${{D.ano_max}})</div></div>
            <div class="km"><div class="val">${{D.anos.length}}</div><div class="lbl">anos analisados</div></div>
          `;

          // KPI cards
          const b0 = bercos[0], b1 = bercos[1]||bercos[0];
          const d0 = D.dados[b0], d1 = D.dados[b1]||d0;
          const lastDea0 = d0.dea[d0.dea.length-1];
          const lastDea1 = d1.dea[d1.dea.length-1];
          document.getElementById('kpis-cards').innerHTML = `
            <div class="kcard t"><div class="klbl">Volume Total</div><div class="kval">${{D.vol_acum}} Mt</div><div class="kdelta up">Acumulado 2015–${{anos[anos.length-1]}}</div></div>
            <div class="kcard a"><div class="klbl">Prancha Máxima</div><div class="kval">${{D.prancha_max.toFixed(0)}} t/h</div><div class="kdelta up">${{D.berco_max}} · ${{D.ano_max}}</div></div>
            <div class="kcard b"><div class="klbl">DEA ${{b0}}</div><div class="kval">${{lastDea0}}%</div><div class="kdelta up">Escore ${{anos[anos.length-1]}}</div></div>
            <div class="kcard r"><div class="klbl">DEA ${{b1}}</div><div class="kval">${{lastDea1}}%</div><div class="kdelta">Escore ${{anos[anos.length-1]}}</div></div>
          `;

          // Insight tendência
          document.getElementById('ins-tend').textContent =
            `Crescimento de ${{D.slope > 0 ? '+':''}}${{D.slope}} Mt/ano (R²=${{D.r2}}), confirmando tendência ${{D.slope>0?'crescente':'decrescente'}} ao longo do período analisado.`;

          // Volume total
          new Chart(document.getElementById('cVolTotal'),{{type:'bar',data:{{labels:anos,datasets:[
            {{label:'Volume Total (Mt)',data:D.total_vol,backgroundColor:'rgba(0,201,167,0.15)',borderColor:'#00c9a7',borderWidth:2,borderRadius:4}},
            {{label:'Tendência',data:D.tend_vol,type:'line',borderColor:'#f5a623',borderWidth:2,borderDash:[6,3],pointRadius:0,tension:.4}}
          ]}},options:bOpts(' Mt')}});

          // Pizza
          const volBerco = bercos.map(b=>D.dados[b].volume.reduce((a,c)=>a+c,0).toFixed(1));
          new Chart(document.getElementById('cPizza'),{{type:'doughnut',data:{{labels:bercos,datasets:[{{data:volBerco,backgroundColor:['rgba(0,201,167,0.7)','rgba(61,155,233,0.7)'],borderColor:['#00c9a7','#3d9be9'],borderWidth:2}}]}},options:{{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{{legend:{{position:'bottom',labels:{{color:'#6b8aaa',boxWidth:12,padding:16}}}},tooltip:tip}}}}}});

          // Volume por berço
          const cores=['#00c9a7','#3d9be9','#f5a623','#ff4e6a'];
          document.getElementById('vol-bercos').innerHTML = bercos.map((b,i)=>`
            <div class="card"><div class="ch"><div><div class="ctitle">${{b}} — Volume Anual (Mt)</div><div class="csub">Evolução por ano</div></div></div>
            <div class="cw"><canvas id="cVol_${{i}}" height="130"></canvas></div></div>
          `).join('');
          bercos.forEach((b,i)=>{{
            new Chart(document.getElementById(`cVol_${{i}}`),{{type:'line',data:{{labels:anos,datasets:[{{label:'Volume Mt',data:D.dados[b].volume,borderColor:cores[i],backgroundColor:cores[i].replace(')',',0.08)').replace('rgb','rgba'),borderWidth:2.5,fill:true,tension:.4,pointBackgroundColor:cores[i],pointRadius:4}}]}},options:bOpts(' Mt')}});
          }});

          // Prancha comparativa
          new Chart(document.getElementById('cPrancha'),{{type:'line',data:{{labels:anos,datasets:[
            ...bercos.map((b,i)=>{{return{{label:`${{b}} (t/h)`,data:D.dados[b].prancha,borderColor:cores[i],borderWidth:2.5,tension:.4,pointBackgroundColor:cores[i],pointRadius:4}}}}}),
            {{label:'Meta ANTAQ (800 t/h)',data:anos.map(()=>800),borderColor:'#f5a623',borderWidth:1.5,borderDash:[8,4],pointRadius:0}}
          ]}},options:{{...bOpts(' t/h'),scales:{{...bOpts(' t/h').scales,y:{{...bOpts(' t/h').scales.y,min:100}}}}}}}});

          // DEA
          new Chart(document.getElementById('cDEA'),{{type:'line',data:{{labels:anos,datasets:bercos.map((b,i)=>{{return{{label:`${{b}} (%)`,data:D.dados[b].dea,borderColor:i===0?'#00c9a7':'#ff4e6a',backgroundColor:i===0?'rgba(0,201,167,0.06)':'rgba(255,78,106,0.06)',fill:true,borderWidth:2.5,tension:.3,pointBackgroundColor:i===0?'#00c9a7':'#ff4e6a',pointRadius:4}}}})}},options:{{...bOpts('%'),scales:{{...bOpts('%').scales,y:{{...bOpts('%').scales.y,min:0,max:110,ticks:{{...tck,callback:v=>v+'%'}}}}}}}}}});

          // Nav ativo
          document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',function(){{
            document.querySelectorAll('nav a').forEach(x=>x.classList.remove('active'));
            this.classList.add('active');
          }}));
          </script>
          </body></html>"""

          with open('dashboard_portuario_vila_conde.html','w',encoding='utf-8') as f:
              f.write(html)

          print(f"\n✅ Dashboard gerado com sucesso!")
          print(f"   Anos: {anos_lista}")
          print(f"   Berços: {bercos_lista}")
          print(f"   Atualizado em: {ultima_atualizacao}")
          EOF

      # 6. Faz commit e push do dashboard atualizado
      - name: 📤 Publicar dashboard atualizado no GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dashboard_portuario_vila_conde.html
          git add "Dados Atracacao/" "Dados Carga/" || true
          git diff --staged --quiet || git commit -m "🔄 Atualização automática — $(date '+%d/%m/%Y %H:%M')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7. Confirma que o deploy foi feito
      - name: ✅ Concluído
        run: |
          echo "================================================"
          echo "  Dashboard atualizado com sucesso!"
          echo "  URL: https://lukasnobre.github.io/portfolio-analise-dados/dashboard_portuario_vila_conde.html"
          echo "================================================"
